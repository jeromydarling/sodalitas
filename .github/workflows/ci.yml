name: CI

# Every branch and every pull request. Needs no secrets, so it runs on a fork
# and on a contributor's first PR — the checks that gate a merge should never
# depend on credentials the contributor can't have.
on:
  push:
    branches-ignore: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

      # The migrations run against a local D1 here — no account needed. It
      # catches the class of error that otherwise only shows up mid-deploy,
      # which is exactly when you least want to find it: a duplicate column, a
      # statement the splitter mangles, a table missing from TENANT_TABLES.
      - name: Migrations apply cleanly from empty
        run: npx wrangler d1 migrations apply sodalitas --local
